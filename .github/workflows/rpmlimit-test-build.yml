name: RPM rate-limit test build (single tag, no latest)

# 受控验证镜像：仅在推 git tag `rpmlimit-test` 时触发，只推镜像 tag
# v2.2.30-gw-rpmlimit，绝不动 :latest/:beta。
# 关键：git tag 故意不以 v 开头，避免触发 docker-build.yaml(v*) 与 build.yml(v*-gw*)。
on:
  push:
    tags:
      - 'rpmlimit-test'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Lowercase owner
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push (single tag only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/kiro2cc-proxy:v2.2.30-gw-rpmlimit
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=kiro2cc-proxy per-account RPM rate-limit test build
